<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="supported-color-schemes" content="dark light">
<title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#0b0b10;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0b10" style="background:#0b0b10;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <!-- Logo -->
        <tr>
          <td style="padding:0 0 24px 4px;font-family:Arial,Helvetica,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="36" height="36" valign="middle" style="width:36px;height:36px;"><img src="https://ijpfxbnxfpbhfzrjhdmz.supabase.co/storage/v1/object/public/brand/logo-email.png" width="36" height="36" alt="Atlas Clipping" style="display:block;width:36px;height:36px;border:0;outline:none;"></td>
                <td style="padding-left:12px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;color:#f4f4f5;letter-spacing:-0.3px;">Atlas Clipping</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Card -->
        <tr>
          <td bgcolor="#161619" style="background:#161619;border:1px solid #2e2e34;border-radius:16px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;">
            <div style="height:4px;width:48px;border-radius:4px;background:#bef264;background-image:linear-gradient(90deg,#bef264,#4ade80);margin-bottom:24px;"></div>
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;font-weight:700;color:#f4f4f5;letter-spacing:-0.4px;">Reset your password</h1>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#a1a1aa;">Enter this code on the reset page, then choose a new password. It works once and expires in an hour.</p>
            <p style="margin:0 0 8px;font-size:13px;color:#a1a1aa;">Your code</p>
            <div style="margin:0;padding:16px 0;border-radius:12px;background:#0b0b10;border:1px solid #2e2e34;text-align:center;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:700;letter-spacing:8px;color:#bef264;">{{ .Token }}</div>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:24px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#71717a;">
            Didn't ask for this? You can ignore this email.<br>Atlas Clipping · clipping campaigns for streamers
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
