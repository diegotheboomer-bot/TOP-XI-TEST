# Publishes the Creator Engine demo (mock data, runs in the browser) to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['creator-engine/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: creator-engine/demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
