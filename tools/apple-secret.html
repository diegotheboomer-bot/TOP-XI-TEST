<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Secret Maker</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0c0b; color: #e8ebe8; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: #9aa29a; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #9aa29a; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; background: #151715; color: #e8ebe8; border: 1px solid #2a2e2a; border-radius: 10px; padding: 10px 12px; font: inherit; }
  textarea { height: 140px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  button { margin-top: 18px; width: 100%; height: 46px; border: 0; border-radius: 10px; font: 600 15px system-ui; color: #0b0c0b; background: linear-gradient(90deg, #c6f432, #4ade80); cursor: pointer; }
  .err { color: #fb7185; margin-top: 12px; }
  .ok { color: #a3e635; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Apple secret for Supabase</h1>
  <p>Runs only in this browser. Nothing is uploaded. Use Chrome or Firefox.</p>

  <label for="team">Team ID</label>
  <input id="team" placeholder="57T63M356…" autocomplete="off">

  <label for="kid">Key ID</label>
  <input id="kid" placeholder="From the key you made in Apple Keys" autocomplete="off">

  <label for="sub">Services ID</label>
  <input id="sub" value="com.atlasclipping.web" autocomplete="off">

  <label for="p8">.p8 key file</label>
  <input id="p8" type="file" accept=".p8">

  <button id="go">Make secret</button>
  <div id="msg"></div>

  <label for="out">Secret (paste into Supabase → Apple → Secret Key)</label>
  <textarea id="out" readonly></textarea>
</main>
<script>
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const enc = (obj) => b64url(new TextEncoder().encode(JSON.stringify(obj)));
const msg = (text, ok) => { const m = document.getElementById('msg'); m.className = ok ? 'ok' : 'err'; m.textContent = text; };

document.getElementById('go').onclick = async () => {
  try {
    const team = document.getElementById('team').value.trim();
    const kid = document.getElementById('kid').value.trim();
    const sub = document.getElementById('sub').value.trim();
    const file = document.getElementById('p8').files[0];
    if (!team || !kid || !sub || !file) return msg('Fill in all four.');
    const pem = await file.text();
    const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '')), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('pkcs8', der, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
    const now = Math.floor(Date.now() / 1000);
    // Apple allows at most 6 months (15777000 seconds).
    const data = enc({ alg: 'ES256', kid, typ: 'JWT' }) + '.' + enc({ iss: team, iat: now, exp: now + 15777000, aud: 'https://appleid.apple.com', sub });
    const sig = await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, key, new TextEncoder().encode(data));
    document.getElementById('out').value = data + '.' + b64url(sig);
    const until = new Date((now + 15777000) * 1000).toLocaleDateString();
    msg('Done. It expires on ' + until + ', so make a new one before then.', true);
  } catch (e) {
    msg('Couldn’t read the key. Make sure you picked the .p8 file from Apple. (' + e.message + ')');
  }
};
</script>
</body>
</html>
